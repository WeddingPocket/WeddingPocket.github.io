  }

  class GmailError extends Error {
    constructor(status, detail) {
      super(`gmail ${status}`);
      this.status = status;
      this.detail = detail || '';
    }
  }

  function isGoogleIdentityReady() {
    return Boolean(window.google && google.accounts && google.accounts.oauth2);
  }

  function revokeGmailToken() {
    const token = gmailToken;
    gmailToken = null;
    if (token && isGoogleIdentityReady()) google.accounts.oauth2.revoke(token, () => {});
  }

  function resetGmailView() {
    gmail.requestId += 1;
    gmail.rows = [];
    gmail.nextPageToken = null;
    gmail.openId = null;
    gmail.details = {};
    gmail.loading = false;
    gmail.failure = null;
  }

  function forgetGmail() {
    revokeGmailToken();
    resetGmailView();
  }

  function disconnectGmail() {
    forgetGmail();
    renderConnectPrompt();
  }

  function base64ToBytes(encoded) {
    const normalized = encoded.replace(/-/g, '+').replace(/_/g, '/').replace(/\s/g, '');
    const padded = normalized + '='.repeat((4 - (normalized.length % 4)) % 4);
    return Uint8Array.from(atob(padded), (character) => character.charCodeAt(0));
  }

  function quotedPrintableToBytes(encoded) {
    const text = encoded.replace(/_/g, ' ');
    const bytes = [];
    for (let index = 0; index < text.length; index += 1) {
      const isEscape = text[index] === '=' && /^[0-9a-fA-F]{2}$/.test(text.slice(index + 1, index + 3));
      bytes.push(isEscape ? parseInt(text.slice(index + 1, index + 3), 16) : text.charCodeAt(index));
      if (isEscape) index += 2;
    }
    return Uint8Array.from(bytes);
  }

  function decodeBytes(bytes, charset) {
    try {
      return new TextDecoder(charset || 'utf-8').decode(bytes);
    } catch {
      return new TextDecoder('utf-8').decode(bytes);
    }
  }

  function decodeMimeWords(text) {
    return text
      .replace(/(\?=)\s+(=\?)/g, '$1$2')
      .replace(/=\?([\w-]+)\?([BbQq])\?([^?]*)\?=/g, (whole, charset, method, payload) => {
        const bytes = method.toUpperCase() === 'B' ? base64ToBytes(payload) : quotedPrintableToBytes(payload);
        return decodeBytes(bytes, charset);
      });
  }

  function decodeHtmlEntities(text) {
    return new DOMParser().parseFromString(text, 'text/html').documentElement.textContent;
  }

  function headerValue(headers, name) {
    const found = (headers || []).find((header) => header.name.toLowerCase() === name.toLowerCase());
    return found ? decodeMimeWords(found.value) : '';
  }

  function parseSender(raw) {
    const match = raw.match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);
    if (!match) return { name: '', address: raw.trim() };
    return { name: match[1].trim(), address: match[2].trim() };
  }

  function seoulParts(millis) {
    const formatter = new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    });
    return Object.fromEntries(formatter.formatToParts(new Date(millis)).map((part) => [part.type, part.value]));
  }

  function formatMailTime(millis) {
    const parts = seoulParts(millis);
    const yearLabel = parts.year === seoulParts(Date.now()).year ? '' : `${parts.year}년 `;
    return `${yearLabel}${Number(parts.month)}월 ${Number(parts.day)}일 ${parts.hour}:${parts.minute}`;
  }

  function mailSummary(message) {
    const headers = message.payload && message.payload.headers;
    return {
      id: message.id,
      threadId: message.threadId,
      sender: parseSender(headerValue(headers, 'From')),
      subject: headerValue(headers, 'Subject') || '(제목 없음)',
      receivedAt: Number(message.internalDate),
      snippet: decodeHtmlEntities(message.snippet || ''),
      unread: (message.labelIds || []).includes('UNREAD')
    };
  }

  function gmailUrl(path, params) {
    const url = new URL(`${GMAIL_API}/${path}`);
    Object.entries(params || {}).forEach(([name, value]) => {
      [].concat(value).forEach((item) => {
        if (item !== null && item !== undefined && item !== '') url.searchParams.append(name, item);
      });
    });
    return url;
  }

  async function readGmailErrorDetail(response) {
    try {
      return JSON.stringify(await response.json());
    } catch {
      return '';
    }
  }

  async function requestGmail(path, params) {
    if (!gmailToken) throw new GmailError(401);
    let response;
    try {
      response = await fetch(gmailUrl(path, params), { headers: { Authorization: `Bearer ${gmailToken}` } });
    } catch {
      throw new GmailError(0);
    }
    if (response.ok) return response.json();
    throw new GmailError(response.status, await readGmailErrorDetail(response));
  }

  async function mapWithLimit(items, limit, worker) {
    const results = new Array(items.length);
    let nextIndex = 0;
    async function drain() {
      while (nextIndex < items.length) {
        const index = nextIndex;
        nextIndex += 1;
        results[index] = await worker(items[index]);
      }
    }
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, drain));
    return results;
  }

  function fetchMailSummary(id) {
    return requestGmail(`messages/${id}`, { format: 'metadata', metadataHeaders: GMAIL_SUMMARY_HEADERS }).then(mailSummary);
  }

  async function fetchInquiryPage(pageToken) {
    const list = await requestGmail('messages', { q: GMAIL_QUERIES[gmail.mode], maxResults: GMAIL_PAGE_SIZE, pageToken });
    const ids = (list.messages || []).map((message) => message.id);
    const rows = await mapWithLimit(ids, GMAIL_FETCH_CONCURRENCY, fetchMailSummary);
    return { rows, nextPageToken: list.nextPageToken || null };
  }

  function flattenParts(part) {
    return [part, ...(part.parts || []).flatMap(flattenParts)];
  }

  function partCharset(part) {
    const contentType = headerValue(part.headers, 'Content-Type');
    const match = contentType.match(/charset="?([\w-]+)/i);
    return match ? match[1] : 'utf-8';
  }

  function decodePartText(part) {
    return decodeBytes(base64ToBytes(part.body.data), partCharset(part));
  }

  function hasInlineText(part, mimeType) {
    return part.mimeType === mimeType && !part.filename && Boolean(part.body && part.body.data);
  }

  function htmlToPlainText(html) {
    const document_ = new DOMParser().parseFromString(html, 'text/html');
    document_.querySelectorAll('script, style').forEach((node) => node.remove());
    document_.querySelectorAll('br').forEach((node) => node.replaceWith('\n'));
    document_.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6').forEach((node) => node.append('\n'));
    return document_.body.textContent;
  }

  function tidyMailText(text) {
    return text.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function pickBodyText(payload) {
    const parts = flattenParts(payload);
    const plain = parts.find((part) => hasInlineText(part, 'text/plain'));
    if (plain) return tidyMailText(decodePartText(plain));
    const html = parts.find((part) => hasInlineText(part, 'text/html'));
    if (html) return tidyMailText(htmlToPlainText(decodePartText(html)));
    return '';
  }

  function collectAttachmentNames(payload) {
    return flattenParts(payload).filter((part) => part.filename).map((part) => part.filename);
  }

  function mailContent(message) {
    return { body: pickBodyText(message.payload), attachments: collectAttachmentNames(message.payload) };
  }

  function isAdminMailbox(profile) {
    return String(profile.emailAddress || '').toLowerCase() === GMAIL_ADMIN_ADDRESS;
  }

  function hasGrantedGmailScope(response) {
    return google.accounts.oauth2.hasGrantedAllScopes(response, GMAIL_SCOPE);
  }

  function isPermissionFailure(error) {
    return error.status === 403 && /insufficient|scope/i.test(error.detail);
  }

  function describeTokenError(code) {
    if (code === 'access_denied') return 'Gmail 읽기 권한을 허용해 주세요';
    return '연결하지 못했어요. 다시 시도해 주세요';
  }

  function connectPromptButton() {
    return el('button', { class: 'btn btn-primary', type: 'button', onclick: connectGmail, text: 'Gmail 연결하기' });
  }

  function renderConnectPrompt(errorMessage) {
    clear($('panel-inquiries')).append(
      errorMessage && notice(errorMessage),
      el('div', { class: 'empty' },
        el('b', { text: 'Gmail을 연결해 주세요' }),
        '메일을 읽기만 하고, 어디에도 저장하지 않아요.',
        el('div', { class: 'empty-action' }, connectPromptButton())));
  }

  function renderUnconfiguredPrompt() {
    clear($('panel-inquiries')).append(emptyState('Gmail 연결 설정이 아직 안 됐어요'));
  }

  function gmailClient() {
    if (!gmailTokenClient) {
      gmailTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GMAIL_OAUTH_CLIENT_ID,
        scope: GMAIL_SCOPE,
        hint: GMAIL_ADMIN_ADDRESS,
        callback: handleTokenResponse,
        error_callback: handleTokenPopupError
      });
    }
    return gmailTokenClient;
  }

  function connectGmail() {
    if (!isGoogleIdentityReady()) return renderConnectPrompt('Google 연결 도구를 불러오지 못했어요. 새로고침해 주세요');
    gmailClient().requestAccessToken();
  }

  function handleTokenPopupError(error) {
    if (error.type === 'popup_failed_to_open') return renderConnectPrompt('팝업이 막혀 있어요. 팝업을 허용해 주세요');
    renderConnectPrompt();
  }

  async function handleTokenResponse(response) {
    if (response.error) return renderConnectPrompt(describeTokenError(response.error));
    if (!hasGrantedGmailScope(response)) return renderConnectPrompt('Gmail 읽기 권한을 허용해 주세요');
    gmailToken = response.access_token;
    await admitAdminMailbox();
  }

  async function admitAdminMailbox() {
    try {
      const profile = await requestGmail('profile');
      if (isAdminMailbox(profile)) return openInquiryList();
      forgetGmail();
      renderConnectPrompt('관리자 메일 계정으로 연결해 주세요');
    } catch (error) {
      handleGmailFailure(error);
    }
  }

  function handleGmailFailure(error) {
    if (error.status === 401) {
      forgetGmail();
      return renderConnectPrompt('연결이 만료됐어요. 다시 연결해 주세요');
    }
    if (isPermissionFailure(error)) {
      forgetGmail();
      return renderConnectPrompt('Gmail 읽기 권한을 허용해 주세요');
    }
    gmail.loading = false;
    gmail.failure = error.status === 0 ? '네트워크 연결을 확인해 주세요' : '메일을 불러오지 못했어요. 잠시 후 다시 시도해 주세요';
    renderInquiryList();
  }

  function changeInquiryMode(mode) {
    if (mode === gmail.mode) return;
    gmail.mode = mode;
    resetGmailView();
    openInquiryList();
  }

  function inquiryToolbar() {
    const modeButtons = GMAIL_MODE_LABELS.map(([mode, label]) => segmentedButton(label, gmail.mode === mode, () => changeInquiryMode(mode)));
    return el('div', { class: 'toolbar' },
      el('h2', { text: '문의' }),
      el('div', { class: 'spacer' }),
      el('div', { class: 'seg' }, modeButtons),
      el('button', { class: 'btn btn-small', type: 'button', onclick: disconnectGmail, text: '연결 해제' }));
  }

  function openInquiryList() {
    clear($('panel-inquiries')).append(inquiryToolbar(), el('div', { class: 'list', id: 'inquiry-list' }));
    loadInquiries(false);
  }

  async function loadInquiries(append) {
    const requestId = ++gmail.requestId;
    if (!append) {
      gmail.rows = [];
      gmail.nextPageToken = null;
    }
    gmail.loading = true;
    gmail.failure = null;
    renderInquiryList();
    try {
      const page = await fetchInquiryPage(append ? gmail.nextPageToken : null);
      if (requestId !== gmail.requestId) return;
      gmail.rows = gmail.rows.concat(page.rows);
      gmail.nextPageToken = page.nextPageToken;
      gmail.loading = false;
      renderInquiryList();
    } catch (error) {
      if (requestId === gmail.requestId) handleGmailFailure(error);
    }
  }

  function retryInquiries() {
    loadInquiries(gmail.rows.length > 0 && Boolean(gmail.nextPageToken));
  }

  function loadMoreInquiries() {
    loadInquiries(true);
  }

  async function loadMailDetail(id) {
    const requestId = gmail.requestId;
    gmail.details[id] = { status: 'loading' };
    renderInquiryList();
    try {
      const message = await requestGmail(`messages/${id}`, { format: 'full' });
      if (requestId !== gmail.requestId) return;
      gmail.details[id] = { status: 'ready', ...mailContent(message) };
      renderInquiryList();
    } catch (error) {
      if (requestId !== gmail.requestId) return;
      gmail.details[id] = { status: 'failed', message: error.status === 0 ? '네트워크 연결을 확인해 주세요' : '본문을 불러오지 못했어요' };
      if (error.status === 401 || isPermissionFailure(error)) return handleGmailFailure(error);
      renderInquiryList();
    }
  }

  function toggleMail(id) {
    gmail.openId = gmail.openId === id ? null : id;
    renderInquiryList();
    const detail = gmail.details[id];
    if (gmail.openId === id && (!detail || detail.status === 'failed')) loadMailDetail(id);
  }

  function gmailThreadUrl(row) {
    return `https://mail.google.com/mail/u/?authuser=${encodeURIComponent(GMAIL_ADMIN_ADDRESS)}#all/${row.threadId}`;
  }

  function replyUrl(row) {
    const subject = /^re:/i.test(row.subject) ? row.subject : `Re: ${row.subject}`;
    return `mailto:${row.sender.address}?subject=${encodeURIComponent(subject)}`;
  }

  function mailActions(row) {
    return el('div', { class: 'mail-actions' },
      el('a', { class: 'btn btn-small', href: gmailThreadUrl(row), target: '_blank', rel: 'noopener', text: 'Gmail에서 열기' }),
      el('a', { class: 'btn btn-small btn-primary', href: replyUrl(row), text: '답장하기' }));
  }

  function attachmentChips(names) {
    if (!names.length) return null;
    return el('div', { class: 'chips' }, el('span', { class: 'review-meta', text: '첨부 파일' }), names.map((name) => el('span', { class: 'chip', text: name })));
  }

  function mailSenderLine(row) {
    return el('div', { class: 'review-meta', text: `${row.sender.name ? `${row.sender.name} ` : ''}<${row.sender.address}> · ${formatDateTime(row.receivedAt)}` });
  }

  function mailDetailBody(row) {
    const detail = gmail.details[row.id];
    if (!detail || detail.status === 'loading') return skeletons(1, 'skeleton-row');
    if (detail.status === 'failed') {
      return [
        el('div', { class: 'row-error', role: 'alert', text: detail.message }),
        el('div', {}, el('button', { class: 'btn btn-small', type: 'button', onclick: () => loadMailDetail(row.id), text: '다시 시도' }))
      ];
    }
    return [
      el('p', { class: detail.body ? 'mail-body' : 'mail-body review-comment is-empty', text: detail.body || '(본문 없음)' }),
      attachmentChips(detail.attachments)
    ];
  }

  function mailDetail(row) {
    return el('div', { class: 'mail-detail' }, mailSenderLine(row), mailDetailBody(row), mailActions(row));
  }

  function mailRowButton(row, isOpen) {
    const senderName = row.sender.name || row.sender.address;
    return el('button', { class: 'mail-row', type: 'button', 'aria-expanded': String(isOpen), onclick: () => toggleMail(row.id) },
      el('span', row.unread ? { class: 'mail-dot is-unread', role: 'img', 'aria-label': '읽지 않음', title: '읽지 않음' } : { class: 'mail-dot', 'aria-hidden': 'true' }),
      el('span', { class: 'mail-main' },
        el('span', { class: 'mail-from' }, el('strong', { text: senderName }), row.sender.name && el('span', { text: row.sender.address })),
        el('span', { class: 'mail-subject', text: row.subject }),
        el('span', { class: 'mail-snippet', text: row.snippet })),
      el('span', { class: 'mail-date', text: formatMailTime(row.receivedAt) }));
  }

  function mailItem(row) {
    const isOpen = gmail.openId === row.id;
    return el('article', { class: isOpen ? 'mail is-open' : 'mail' }, mailRowButton(row, isOpen), isOpen && mailDetail(row));
  }

  function inquiryEmptyState() {
    if (gmail.mode === 'inbox') return emptyState('받은편지함이 비어 있어요');
    return emptyState('아직 문의 메일이 없어요', '제목이 "[화:답] 문의/건의"인 메일이 오면 여기에 보여요.');
  }

  function inquiryFailureBlock() {
    return el('div', { class: 'mail-more' },
      el('div', { class: 'row-error', role: 'alert', text: gmail.failure }),
      el('button', { class: 'btn btn-small', type: 'button', onclick: retryInquiries, text: '다시 시도' }));
  }

  function moreInquiriesButton() {
    return el('div', { class: 'mail-more' }, el('button', { class: 'btn', type: 'button', onclick: loadMoreInquiries, text: '더 보기' }));
  }

  function inquiryListContent() {
    const isEmpty = gmail.rows.length === 0;
    if (gmail.loading && isEmpty) return skeletons(3, 'skeleton-row');
    if (isEmpty && !gmail.failure) return [inquiryEmptyState()];
    return [
      gmail.rows.map(mailItem),
      gmail.loading && skeletons(1, 'skeleton-row'),
      gmail.failure && inquiryFailureBlock(),
      gmail.nextPageToken && !gmail.loading && !gmail.failure && moreInquiriesButton()
    ];
  }

  function renderInquiryList() {
    const list = $('inquiry-list');
    if (list) appendChildren(clear(list), inquiryListContent());
  }

  function loadInquiriesPanel() {
    if (!GMAIL_OAUTH_CLIENT_ID) return renderUnconfiguredPrompt();
    renderConnectPrompt();
  }

  function toVersionForm(row) {
    return {
      minVersion: String(row.min_version_code),
      latestVersion: String(row.latest_version_code),
      noticeActive: Boolean(row.notice_active),
      noticeLevel: row.notice_level === 'warning' ? 'warning' : 'info',
      noticeTitle: row.notice_title || '',
      noticeBody: row.notice_body || ''
    };
  }

  function parseVersion(text) {
    return /^\d+$/.test(text.trim()) ? Number(text.trim()) : null;
  }

  function versionErrors(form) {
    const min = parseVersion(form.minVersion);
    const latest = parseVersion(form.latestVersion);
    const errors = [];
    if (min === null) errors.push('최소 지원 버전은 0 이상의 정수로 입력해 주세요');
    if (latest === null) errors.push('최신 버전은 0 이상의 정수로 입력해 주세요');
    if (min !== null && latest !== null && latest < min) errors.push('최신 버전은 최소 지원 버전보다 낮을 수 없어요');
    return errors;
  }

  function noticeErrors(form) {
    const errors = [];
    if (form.noticeActive && !form.noticeTitle.trim()) errors.push('공지를 켜려면 제목을 입력해 주세요');
    if (form.noticeTitle.length > NOTICE_TITLE_LIMIT) errors.push(`제목은 ${NOTICE_TITLE_LIMIT}자까지 쓸 수 있어요`);
    if (form.noticeBody.length > NOTICE_BODY_LIMIT) errors.push(`내용은 ${NOTICE_BODY_LIMIT}자까지 쓸 수 있어요`);
    return errors;
  }

  function settingsErrors(form) {
    return [...versionErrors(form), ...noticeErrors(form)];
  }

  function isRaisingMinVersion(form) {
    return Number(form.minVersion) > Number(state.appConfig.row.min_version_code);
  }

  function saveErrorMessages(error) {
    if (isMissingFunction(error) || error.code !== '22023') return [describeError(error)];
    const message = error.message || '';
    if (/latest_version_code/.test(message)) return ['최신 버전은 최소 지원 버전보다 낮을 수 없어요'];
    if (/level/.test(message)) return ['공지 종류가 올바르지 않아요'];
    if (/title|body/.test(message)) return [`제목은 ${NOTICE_TITLE_LIMIT}자, 내용은 ${NOTICE_BODY_LIMIT}자까지 쓸 수 있어요`];
    return ['입력한 값을 확인해 주세요'];
  }

  function updateAppConfigParams(form) {
    return {
      p_min_version_code: Number(form.minVersion),
      p_latest_version_code: Number(form.latestVersion),
      p_notice_active: form.noticeActive,
      p_notice_title: form.noticeTitle.trim(),
      p_notice_body: form.noticeBody.trim(),
      p_notice_level: form.noticeLevel
    };
  }

  function bannerNode(form) {
    const title = form.noticeTitle.trim() || '공지 제목이 여기에 보여요';
    const classes = ['banner', `banner-${form.noticeLevel}`, form.noticeActive ? '' : 'is-off'].filter(Boolean).join(' ');
    return el('div', { class: classes, id: 'banner-preview' },
      el('div', { class: 'banner-title', text: title }),
      el('div', { class: 'banner-body', text: form.noticeBody.trim() }));
  }

  function refreshBannerPreview() {
    $('banner-preview').replaceWith(bannerNode(state.appConfig.form));
  }

  function counterText(value, limit) {
    return `${value.length} / ${limit}`;
  }

  function bindTextField(key, counterId, limit) {
    return (event) => {
      state.appConfig.form[key] = event.target.value;
      if (counterId) $(counterId).textContent = counterText(event.target.value, limit);
      if (counterId) refreshBannerPreview();
    };
  }

  function versionInput(key, id) {
    return el('input', {
      class: 'field', id, type: 'text', inputmode: 'numeric', autocomplete: 'off', value: state.appConfig.form[key],
      oninput: bindTextField(key)
    });
  }

  function versionRow(label, id, key, hint) {
    return el('div', { class: 'form-row' },
      el('label', { class: 'form-label', for: id, text: label }),
      versionInput(key, id),
      el('div', { class: 'hint', text: hint }));
  }

  function currentVersionFacts() {
    const row = state.appConfig.row;
    return el('dl', { class: 'facts' },
      el('div', {}, el('dt', { text: '현재 최소 지원 버전' }), el('dd', { text: formatNumber(row.min_version_code) })),
      el('div', {}, el('dt', { text: '현재 최신 버전' }), el('dd', { text: formatNumber(row.latest_version_code) })));
  }

  function versionSection() {
    return el('section', { class: 'settings-card' },
      el('h3', { text: '버전' }),
      currentVersionFacts(),
      el('div', { class: 'form-grid' },
        versionRow('최소 지원 버전 (versionCode)', 'min-version', 'minVersion', "최소 지원 버전보다 낮은 앱에는 앱을 켤 때마다 '업데이트가 필요해요' 팝업이 떠요 (닫을 수 있어요)"),
        versionRow('최신 버전 (versionCode)', 'latest-version', 'latestVersion', "최신 버전보다 낮은 앱에는 '새 버전이 나왔어요' 알림이 버전마다 한 번 떠요")));
  }

  function noticeActiveToggle() {
    return el('label', { class: 'check' },
      el('input', { type: 'checkbox', checked: state.appConfig.form.noticeActive, onchange: (event) => changeNoticeActive(event.target.checked) }),
      '공지 켜기');
  }

  function noticeLevelPicker() {
    const buttons = NOTICE_LEVELS.map(([level, label]) =>
      segmentedButton(label, state.appConfig.form.noticeLevel === level, () => changeNoticeLevel(level)));
    return el('div', { class: 'form-row' }, el('span', { class: 'form-label', text: '종류' }), el('div', { class: 'seg', style: 'justify-self:start' }, buttons));
  }

  function noticeTitleField() {
    const form = state.appConfig.form;
    return el('div', { class: 'form-row' },
      el('label', { class: 'form-label', for: 'notice-title', text: '제목' }),
      el('input', {
        class: 'field', id: 'notice-title', type: 'text', maxlength: NOTICE_TITLE_LIMIT, autocomplete: 'off', value: form.noticeTitle,
        oninput: bindTextField('noticeTitle', 'notice-title-count', NOTICE_TITLE_LIMIT)
      }),
      el('div', { class: 'counter', id: 'notice-title-count', text: counterText(form.noticeTitle, NOTICE_TITLE_LIMIT) }));
  }

  function noticeBodyField() {
    const form = state.appConfig.form;
    const textarea = el('textarea', {
      class: 'field', id: 'notice-body', maxlength: NOTICE_BODY_LIMIT, rows: 4,
      oninput: bindTextField('noticeBody', 'notice-body-count', NOTICE_BODY_LIMIT)
    });
    textarea.value = form.noticeBody;
    return el('div', { class: 'form-row' },
      el('label', { class: 'form-label', for: 'notice-body', text: '내용' }),
      textarea,
      el('div', { class: 'counter', id: 'notice-body-count', text: counterText(form.noticeBody, NOTICE_BODY_LIMIT) }));
  }

  function noticePreview() {
    const form = state.appConfig.form;
    return el('div', { class: 'form-row' },
      el('span', { class: 'form-label', text: '미리보기' }),
      bannerNode(form),
      el('div', { class: 'hint', text: form.noticeActive ? '앱에서 이렇게 보여요' : '공지가 꺼져 있어서 지금은 앱에 보이지 않아요' }));
  }

  function noticeSection() {
    return el('section', { class: 'settings-card' },
      el('h3', { text: '공지' }),
      noticeActiveToggle(),
      noticeLevelPicker(),
      noticeTitleField(),
      noticeBodyField(),
      noticePreview(),
      el('div', { class: 'hint', text: '공지를 켜거나 내용을 바꾸면 닫았던 사용자에게도 다시 보여요' }));
  }

  function raiseConfirmBlock() {
    return el('div', { class: 'callout', role: 'alert' },
      el('div', {}, '최소 버전을 올리면 그보다 낮은 앱 사용자에게 앱을 켤 때마다 업데이트 팝업이 떠요. 계속할까요?'),
      el('div', { class: 'save-bar' },
        el('button', { class: 'btn btn-danger', type: 'button', onclick: submitAppConfig, text: '올리고 저장' }),
        el('button', { class: 'btn', type: 'button', onclick: cancelRaiseConfirm, text: '취소' })));
  }

  function saveStatus() {
    const config = state.appConfig;
    if (!config.savedAt) return null;
    return [el('span', { class: 'save-ok', text: '저장했어요' }), el('span', { class: 'save-time', text: `업데이트 ${formatDateTime(config.savedAt)}` })];
  }

  function lastUpdatedNote() {
    const config = state.appConfig;
    if (config.savedAt || !config.row.updated_at) return null;
    return el('span', { class: 'save-time', text: `마지막 저장 ${formatDateTime(config.row.updated_at)}` });
  }

  function errorList() {
    const errors = state.appConfig.errors;
    if (!errors.length) return null;
    return el('ul', { class: 'field-errors', role: 'alert' }, errors.map((message) => el('li', { text: message })));
  }

  function saveBar() {
    const config = state.appConfig;
    if (config.confirmRaise) return raiseConfirmBlock();
    return el('div', { class: 'save-bar' },
      el('button', { class: 'btn btn-primary', type: 'button', disabled: config.saving, onclick: requestSave, text: config.saving ? '저장하는 중' : '저장' }),
      saveStatus(),
      lastUpdatedNote());
  }

  function renderAppSettings() {
    clear($('panel-settings')).append(
      el('div', { class: 'settings' }, versionSection(), noticeSection(), errorList(), saveBar()));
  }

  function changeNoticeActive(active) {
    state.appConfig.form.noticeActive = active;
    renderAppSettings();
  }

  function changeNoticeLevel(level) {
    state.appConfig.form.noticeLevel = level;
    renderAppSettings();
  }

  function cancelRaiseConfirm() {
    state.appConfig.confirmRaise = false;
    renderAppSettings();
  }

  function requestSave() {
    const config = state.appConfig;
    config.savedAt = null;
    config.errors = settingsErrors(config.form);
    config.confirmRaise = config.errors.length === 0 && isRaisingMinVersion(config.form);
    if (config.errors.length === 0 && !config.confirmRaise) return submitAppConfig();
    renderAppSettings();
  }

  function applySavedConfig(row) {
    const config = state.appConfig;
    config.row = row;
    config.form = toVersionForm(row);
    config.savedAt = row.updated_at || new Date().toISOString();
    config.errors = [];
  }

  async function submitAppConfig() {
    const config = state.appConfig;
    config.confirmRaise = false;
    config.saving = true;
    renderAppSettings();
    const { data, error } = await db.rpc('admin_update_app_config', updateAppConfigParams(config.form));
    config.saving = false;
    if (error || !data || !data[0]) config.errors = error ? saveErrorMessages(error) : ['문제가 생겼어요. 잠시 후 다시 시도해 주세요'];
    else applySavedConfig(data[0]);
    renderAppSettings();
  }

  function appSettingsFailure(error) {
    const retry = el('button', { class: 'btn', type: 'button', onclick: loadAppSettingsPanel, text: '다시 불러오기' });
    clear($('panel-settings')).append(notice(describeError(error) || '앱 설정을 불러오지 못했어요'), el('div', {}, retry));
  }

  async function loadAppSettingsPanel() {
    const requestId = ++state.appConfig.requestId;
    clear($('panel-settings')).append(...skeletons(2, 'skeleton-row'));
    const { data, error } = await db.rpc('admin_get_app_config');
    if (requestId !== state.appConfig.requestId) return;
    if (error || !data || !data[0]) return appSettingsFailure(error);
    Object.assign(state.appConfig, { row: data[0], form: toVersionForm(data[0]), confirmRaise: false, saving: false, savedAt: null, errors: [] });
    renderAppSettings();
  }

  const TAB_LOADERS = {
    dashboard: loadDashboard,
    parse: loadParseQuality,
    reviews: loadReviewsPanel,
    users: loadUsersPanel,
    inquiries: loadInquiriesPanel,
    settings: loadAppSettingsPanel
  };

  function bindStaticControls() {
    $('login').addEventListener('click', startLogin);
    $('logout').addEventListener('click', signOut);
    $('tabs').addEventListener('click', (event) => {
      const tab = event.target.closest('.tab');
      if (tab) selectTab(tab.dataset.tab);
    });
  }

  function listenToAuth() {
    db.auth.onAuthStateChange((event, session) => {
      setTimeout(() => handleSession(session), 0);
    });
  }

  bindStaticControls();
  listenToAuth();
</script>
</body>
</html>
