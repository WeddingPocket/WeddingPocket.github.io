<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>화:답 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f2ee;
    --ink: #1f1a24;
    --ink-soft: #52514e;
    --ink-faint: #898781;
    --accent: #d1546f;
    --accent-strong: #b13c58;
    --accent-ink: #ffffff;
    --border: rgba(31, 26, 36, 0.12);
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --series-blue: #2a78d6;
    --series-orange: #eb6834;
    --series-aqua: #1baf7a;
    --series-yellow: #eda100;
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
    --good-ink: #006300;
    --danger-ink: #b42323;
    --danger-bg: #fdecec;
    --shadow: 0 1px 2px rgba(31, 26, 36, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #242423;
      --ink: #fffaf5;
      --ink-soft: #c3c2b7;
      --ink-faint: #898781;
      --accent: #e2758c;
      --accent-strong: #eea0af;
      --accent-ink: #1a1013;
      --border: rgba(255, 255, 255, 0.12);
      --grid: #2c2c2a;
      --axis: #383835;
      --series-blue: #3987e5;
      --series-orange: #d95926;
      --series-aqua: #199e70;
      --series-yellow: #c98500;
      --good-ink: #0ca30c;
      --danger-ink: #f19a9a;
      --danger-bg: #3a1c1c;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242423;
    --ink: #fffaf5;
    --ink-soft: #c3c2b7;
    --ink-faint: #898781;
    --accent: #e2758c;
    --accent-strong: #eea0af;
    --accent-ink: #1a1013;
    --border: rgba(255, 255, 255, 0.12);
    --grid: #2c2c2a;
    --axis: #383835;
    --series-blue: #3987e5;
    --series-orange: #d95926;
    --series-aqua: #199e70;
    --series-yellow: #c98500;
    --good-ink: #0ca30c;
    --danger-ink: #f19a9a;
    --danger-bg: #3a1c1c;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar-inner { display: flex; align-items: center; gap: 12px; min-height: 52px; flex-wrap: wrap; padding-block: 16px; }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .brand span { color: var(--accent); }
  .brand small { font-weight: 500; color: var(--ink-faint); font-size: 12px; margin-left: 6px; }
  .spacer { flex: 1; }
  .who { color: var(--ink-soft); font-size: 13px; overflow-wrap: anywhere; }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    padding: 6px 12px;
    font-weight: 500;
    min-height: 34px;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-danger { background: var(--status-critical); border-color: var(--status-critical); color: #fff; font-weight: 600; }
  .btn-danger:hover { background: #b83030; }
  .btn-small { padding: 3px 10px; min-height: 28px; font-size: 13px; }

  .tabs { display: flex; gap: 6px; padding-block: 2px 12px; overflow-x: auto; }
  .tab {
    border: 0;
    background: transparent;
    padding: 10px 14px;
    min-height: 40px;
    border-bottom: 3px solid transparent;
    color: var(--ink-soft);
    font-weight: 500;
    white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

  main { padding-block: 32px 56px; }
  .panel > * + * { margin-top: 16px; }

  .center-card {
    max-width: 380px;
    margin: 72px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .center-card h1 { font-size: 18px; margin: 0 0 6px; }
  .center-card p { margin: 0 0 18px; color: var(--ink-soft); }

  .toolbar { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; font-size: 15px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 5px 12px; min-height: 32px; color: var(--ink-soft); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 700; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .tile-label { color: var(--ink-soft); font-size: 12.5px; }
  .tile-value { font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .tile-sub { color: var(--ink-faint); font-size: 12px; margin-top: 2px; }
  .tile-flag { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; font-weight: 600; margin-top: 2px; color: var(--ink-soft); }

  .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .chart {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px 8px;
    margin: 0;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .chart-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart-total { color: var(--ink-soft); font-size: 12.5px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart svg text { fill: var(--ink-faint); font-size: 10.5px; font-family: inherit; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .cross-line { stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 3 3; }
  .hit { fill: transparent; cursor: crosshair; }

  .tooltip {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12.5px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    white-space: nowrap;
  }
  .tooltip b { font-size: 14px; }

  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; font-weight: 600; color: var(--ink-soft); background: var(--surface-2); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.dim { color: var(--ink-faint); }
  .domain { font-weight: 600; }

  .rate { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .rate-bar { width: 56px; height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  .rate-bar i { display: block; height: 100%; }
  .rate-critical i { background: var(--status-critical); }
  .rate-warning i { background: var(--status-warning); }
  .rate-good i { background: var(--status-good); }
  .rate-label { font-weight: 700; min-width: 44px; text-align: right; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); }
  .badge-critical { border-color: var(--status-critical); }
  .badge-warning { border-color: var(--status-warning); }
  .badge-good { border-color: var(--status-good); }
  .badge-hidden { border-color: var(--danger-ink); color: var(--danger-ink); }
  .row-critical td { background: var(--danger-bg); }

  .field {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    padding: 6px 10px;
    min-height: 34px;
    min-width: 0;
  }
  .field-grow { flex: 1 1 220px; }
  .check { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-soft); user-select: none; }

  .list > * + * { margin-top: 8px; }
  .review {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: grid;
    gap: 6px;
  }
  .review.is-hidden { background: var(--surface-2); }
  .review.is-hidden .review-comment { color: var(--ink-faint); }
  .review-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .review-venue { font-weight: 700; }
  .review-meta { color: var(--ink-faint); font-size: 12.5px; }
  .review-comment { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .review-comment.is-empty { color: var(--ink-faint); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; background: var(--surface); color: var(--ink-soft); }
  .review-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .confirm-text { font-weight: 600; }
  .row-error { color: var(--danger-ink); font-weight: 500; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; padding-top: 8px; }
  .pager span { color: var(--ink-soft); min-width: 64px; text-align: center; }

  .notice { background: var(--danger-bg); color: var(--danger-ink); border-radius: 8px; padding: 10px 14px; font-weight: 500; }
  .empty { text-align: center; color: var(--ink-soft); padding: 40px 16px; background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; }
  .empty b { display: block; color: var(--ink); margin-bottom: 2px; }

  .skeleton { border-radius: 10px; background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  .skeleton-tile { height: 84px; }
  .skeleton-chart { height: 200px; }
  .skeleton-row { height: 72px; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

  .empty-action { margin-top: 14px; }
  .mail { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .mail-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 0 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 12px 14px; }
  .mail-row:hover { background: var(--surface-2); }
  .mail-dot { width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; }
  .mail-dot.is-unread { background: var(--accent); }
  .mail-main { min-width: 0; display: grid; gap: 2px; }
  .mail-from strong { font-weight: 700; }
  .mail-from span { color: var(--ink-faint); font-size: 12.5px; margin-left: 6px; overflow-wrap: anywhere; }
  .mail-subject { font-weight: 500; overflow-wrap: anywhere; }
  .mail-snippet { color: var(--ink-soft); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-date { color: var(--ink-faint); font-size: 12.5px; white-space: nowrap; }
  .mail-detail { border-top: 1px solid var(--border); padding: 14px; display: grid; gap: 12px; }
  .mail-detail > * { min-width: 0; }
  .mail-body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .mail-more { display: flex; justify-content: center; gap: 8px; padding-top: 8px; }

  .user-card, .settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; max-width: 640px; }
  .user-card h3, .settings-card h3 { margin: 0 0 12px; font-size: 16px; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0; }
  .facts div { min-width: 0; }
  .facts dt { color: var(--ink-soft); font-size: 12px; }
  .facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .id-line { margin-top: 12px; color: var(--ink-faint); font-size: 12px; overflow-wrap: anywhere; }

  .settings { display: grid; gap: 16px; max-width: 640px; }
  .settings-card h3 { margin-bottom: 4px; }
  .settings-card > * + * { margin-top: 12px; }
  .settings-card .facts { margin-top: 8px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .form-row { display: grid; gap: 4px; min-width: 0; align-content: start; }
  .form-label { font-weight: 600; }
  .hint { color: var(--ink-faint); font-size: 12.5px; }
  .counter { color: var(--ink-faint); font-size: 12px; text-align: right; }
  .form-row .field { width: 100%; }
  textarea.field { min-height: 96px; resize: vertical; line-height: 1.5; }
  .banner { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: grid; gap: 2px; }
  .banner-info { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .banner-warning { background: color-mix(in srgb, var(--status-warning) 16%, var(--surface)); border-color: color-mix(in srgb, var(--status-warning) 55%, transparent); }
  .banner-title { font-weight: 700; overflow-wrap: anywhere; }
  .banner-body { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-soft); }
  .banner-body:empty { display: none; }
  .banner.is-off { opacity: 0.55; }
  .callout { border: 1px solid var(--status-warning); background: color-mix(in srgb, var(--status-warning) 14%, var(--surface)); border-radius: 10px; padding: 10px 14px; display: grid; gap: 8px; }
  .callout b { font-weight: 700; }
  .save-bar { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
  .save-ok { color: var(--good-ink); font-weight: 600; }
  .save-time { color: var(--ink-faint); font-size: 12.5px; }
  .field-errors { margin: 0; padding-left: 18px; color: var(--danger-ink); font-weight: 500; }
  .tile-link { display: block; width: 100%; text-align: left; cursor: pointer; }
  .tile-link:hover { background: var(--surface-2); }
  .tile-warning { border-color: var(--status-warning); background: color-mix(in srgb, var(--status-warning) 14%, var(--surface)); }
  .tile-warning:hover { background: color-mix(in srgb, var(--status-warning) 22%, var(--surface)); }

  .parse-cards { display: none; }
  .domain-toggle { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 4px 0; font-weight: 600; text-align: left; overflow-wrap: anywhere; }
  .domain-toggle:hover { color: var(--accent-strong); }
  .caret { display: inline-block; transition: transform 0.15s; color: var(--ink-faint); font-size: 11px; }
  [aria-expanded="true"] > .caret { transform: rotate(90deg); }
  .detail-cell { white-space: normal; padding: 0; background: var(--surface-2); }
  .detail-cell .log-detail { position: sticky; left: 0; width: min(720px, calc(100vw - 64px)); }
  .log-detail { padding: 10px 14px 14px; display: grid; gap: 8px; min-width: 0; }
  .log-detail-title { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .log-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .log-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
  .log-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .log-time { font-variant-numeric: tabular-nums; font-weight: 600; }
  .log-meta { color: var(--ink-faint); font-size: 12px; }
  .log-notice { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 8px; padding: 10px 14px; font-weight: 500; }
  .skeleton-line { height: 44px; border-radius: 8px; }
  .chip-warn { border-color: var(--status-warning); }
  .chip-count { font-variant-numeric: tabular-nums; }

  .parse-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .parse-card.row-critical { background: var(--danger-bg); }
  .parse-card-head { display: grid; width: 100%; gap: 10px; border: 0; background: transparent; padding: 12px 14px; text-align: left; min-height: 44px; }
  .parse-card-title { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .parse-card-title b { overflow-wrap: anywhere; flex: 1; min-width: 0; }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 0; }
  .metric dt { font-size: 11px; white-space: nowrap; color: var(--ink-soft); }
  .metric dd { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .metric dd.dim { color: var(--ink-faint); }
  .parse-card-chips { padding: 0 14px 12px; }
  .parse-card .log-detail { border-top: 1px solid var(--border); background: var(--surface-2); }

  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 14px; min-height: 34px; color: var(--ink-soft); font-weight: 500; }
  .filter-chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .filter-hint { color: var(--ink-faint); font-size: 12.5px; }
  .review-select { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer; }
  .review-select input, .check input, .select-all input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
  .review.is-selected { border-color: var(--accent); }
  .select-all { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); min-height: 32px; cursor: pointer; }
  .bulk-bar { position: sticky; bottom: 0; z-index: 5; display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 14px; box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.12); }
  .bulk-bar .bulk-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bulk-count { font-weight: 700; margin-right: auto; }
  .progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; max-width: calc(100vw - 32px); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px; font-weight: 500; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25); }

  @media (max-width: 720px) {
    .charts { grid-template-columns: minmax(0, 1fr); }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tile { padding: 10px 12px; }
    .tile-label { overflow-wrap: anywhere; }
    .tile-value { font-size: 22px; }
    .tile-sub { overflow-wrap: anywhere; }
    main { padding-block: 16px 40px; }
    .topbar-inner { flex-wrap: nowrap; gap: 8px; padding-block: 8px; min-height: 0; }
    .brand { white-space: nowrap; }
    .brand small { display: none; }
    .who { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; overflow-wrap: normal; text-align: right; font-size: 12px; }
    .spacer { display: none; }
    #logout { flex: none; padding-inline: 10px; }
    .btn, .field, .btn-small, .seg button, .filter-chip { min-height: 40px; }

    appendChildren(node, children);
    return node;

  function applyAttributes(node, attrs) {
    Object.entries(attrs).forEach(([name, value]) => {
      if (value === null || value === undefined || value === false) return;
      if (name === 'text') node.textContent = value;
      else if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
      else node.setAttribute(name, value === true ? '' : value);
    });
  }

  function appendChildren(node, children) {
    children.flat().forEach((child) => {
      if (child === null || child === undefined || child === false) return;

    });
  }

    const gap = 14;
    const width = tip.offsetWidth;
    const left = Math.min(event.clientX + gap, window.innerWidth - width - 8);
    tip.style.left = `${Math.max(8, left)}px`;
    tip.style.top = `${Math.max(8, event.clientY - tip.offsetHeight - gap)}px`;
  }

  function hideTooltip() {

  function niceCeiling(value) {
    if (value <= 4) return 4;
    const magnitude = 10 ** Math.floor(Math.log10(value));
    return [2, 4, 6, 8, 10].map((step) => step * magnitude).find((candidate) => candidate >= value);
  }

  function topRoundedBarPath(x, y, width, height, radius) {
    const r = Math.min(radius, width / 2, height);
    return `M${x},${y + height} V${y + r} Q${x},${y} ${x + r},${y} H${x + width - r} Q${x + width},${y} ${x + width},${y + r} V${y + height} Z`;
  }

  function chartGeometry(rowCount, maxValue) {
    const box = { width: 520, height: 176, left: 34, right: 6, top: 8, bottom: 26 };
    const plotWidth = box.width - box.left - box.right;
    const plotHeight = box.height - box.top - box.bottom;
    const step = plotWidth / rowCount;
    return { box, plotWidth, plotHeight, step, ceiling: niceCeiling(maxValue), baseline: box.top + plotHeight };
  }

  function yAxisLayer(geometry) {
    const { box, plotHeight, ceiling } = geometry;
    return [0, ceiling / 2, ceiling].map((tick) => {
      const y = box.top + plotHeight - (tick / ceiling) * plotHeight;
      return svgEl('g', {},
        svgEl('line', { class: tick === 0 ? 'axis-line' : 'grid-line', x1: box.left, x2: box.width - box.right, y1: y, y2: y }),
        svgEl('text', { x: box.left - 6, y: y + 3.5, 'text-anchor': 'end' }, formatNumber(tick)));
    });
  }

  function xAxisLayer(rows, geometry) {
    const { box, step, baseline } = geometry;
    const lastIndex = rows.length - 1;
    const indexes = [...new Set([0, Math.round(lastIndex / 2), lastIndex])];
    return indexes.map((index) => {
      const anchor = index === 0 ? 'start' : index === lastIndex ? 'end' : 'middle';
      const x = box.left + step * index + (anchor === 'start' ? 0 : anchor === 'end' ? step : step / 2);
      return svgEl('text', { x, y: baseline + 16, 'text-anchor': anchor }, formatShortDay(rows[index].day));
    });
  }

  function barLayer(rows, series, geometry) {
    const { box, step, plotHeight, baseline, ceiling } = geometry;
    const barWidth = Math.max(1.5, Math.min(10, step - 2));
    return rows.filter((row) => row[series.key] > 0).map((row) => {
      const index = rows.indexOf(row);
      const height = Math.max(1.5, (row[series.key] / ceiling) * plotHeight);
      const x = box.left + step * index + (step - barWidth) / 2;
      return svgEl('path', { d: topRoundedBarPath(x, baseline - height, barWidth, height, 4), fill: series.color });
    });
  }

  function hoverLayer(rows, series, geometry) {
    const { box, step, plotHeight } = geometry;
    const crosshair = svgEl('line', { class: 'cross-line', y1: box.top, y2: box.top + plotHeight, visibility: 'hidden' });
    const hits = rows.map((row, index) => {
      const x = box.left + step * index;
      const hit = svgEl('rect', { class: 'hit', x, y: box.top, width: step, height: plotHeight });
      hit.addEventListener('pointermove', (event) => {
        crosshair.setAttribute('x1', x + step / 2);
        crosshair.setAttribute('x2', x + step / 2);
        crosshair.setAttribute('visibility', 'visible');
        showTooltip(event, [el('div', { text: formatShortDay(row.day) }), el('b', { text: `${formatNumber(row[series.key])}건` })]);
      });
      hit.addEventListener('pointerleave', () => {
        crosshair.setAttribute('visibility', 'hidden');
        hideTooltip();
      });
      return hit;
    });
    return [crosshair, ...hits];
  }

    const maxValue = Math.max(0, ...rows.map((row) => row[series.key]));

    return svgEl('svg', { viewBox: `0 0 ${box.width} ${box.height}`, role: 'img', 'aria-label': `${series.label} 일별 추이` },

      el('div', { class: 'tile-label', text: '처리 대기 신고' }),
      el('div', { class: 'tile-value', text: formatNumber(count) }),
      count > 0 && el('div', { class: 'tile-flag' }, el('span', { style: 'color:var(--status-warning)', 'aria-hidden': 'true', text: '◆' }), '확인이 필요해요'),
      el('div', { class: 'tile-sub', text: '눌러서 신고된 후기 보기' }));
  }

  function openReportedReviews() {
    state.reviews.reportedOnly = true;
    state.reviews.hiddenOnly = false;
    state.reviews.search = '';
    state.reviews.offset = 0;
    state.loadedTabs.add('reviews');
    selectTab('reviews');
    loadReviewsPanel();
  }

  function overviewTiles(row) {
    const failureRate = Number(row.parse_failure_rate_30d || 0);
    const hasPartialRate = row.parse_partial_rate_30d !== undefined && row.parse_partial_rate_30d !== null;
    const partialRate = Number(row.parse_partial_rate_30d || 0);
    return [
      reportTile(row),
      tile('전체 가입자', formatNumber(row.total_users), `최근 7일 +${formatNumber(row.users_last_7d)} · 30일 +${formatNumber(row.users_last_30d)}`),
      tile('등록된 청첩장', formatNumber(row.total_invites), `최근 30일 +${formatNumber(row.invites_last_30d)}`),
      tile('축의금 기록', formatNumber(row.total_ledger_entries), `최근 30일 +${formatNumber(row.ledger_last_30d)}`),
      tile('식장 후기', formatNumber(row.total_reviews), `숨김 ${formatNumber(row.hidden_reviews)}건`),
      tile('링크 파싱 (30일)', formatNumber(row.parse_logs_last_30d), '고유 링크 기준'),
      tile('링크 파싱 실패율 (30일)', formatPercent(failureRate), null, levelFlag(failureLevel(failureRate))),
      hasPartialRate && tile('링크 파싱 일부 누락 (30일)', formatPercent(partialRate), '핵심 항목 중 일부를 못 읽은 비율', partialRate > 0 && levelFlag(partialLevel()))
    ];
  }

  function renderDashboardShell() {
    clear($('panel-dashboard')).append(
      el('div', { class: 'tiles', id: 'overview-tiles' }, skeletons(7, 'skeleton-tile')),
      el('div', { id: 'activity-section' }));
  }

  async function loadOverview() {
    const { data, error } = await db.rpc('admin_overview');
    const container = clear($('overview-tiles'));
    if (error || !data || !data[0]) {
      container.replaceWith(notice(describeError(error) || '요약을 불러오지 못했어요'));
      return;
    }
    container.append(...overviewTiles(data[0]));
  }

  async function loadActivity() {
    const days = state.activityDays;
    renderActivitySection(el('div', { class: 'charts' }, skeletons(4, 'skeleton-chart')));
    const { data, error } = await db.rpc('admin_daily_activity', { p_days: days });
    if (days !== state.activityDays) return;
    if (error || !data) {
      renderActivitySection(notice(describeError(error) || '활동 내역을 불러오지 못했어요'));
      return;
    }
    state.activityRows = data;
    renderActivitySection();
  }

  function loadDashboard() {
    renderDashboardShell();
    loadOverview();
    loadActivity();
  }

  function successRate(row) {
    return row.total ? Number(row.parsed_count) / Number(row.total) : 0;
  }

  function hasPartialColumns(row) {
    return row.complete_count !== undefined && row.complete_count !== null
      && row.partial_count !== undefined && row.partial_count !== null;
  }

  function completeRate(row) {
    return row.total ? Number(row.complete_count) / Number(row.total) : 0;
  }

  function partialRate(row) {
    return row.total ? Number(row.partial_count) / Number(row.total) : 0;
  }

  function partialCell(row) {
    if (!hasPartialColumns(row)) return el('td', { class: 'num dim', text: '–' });
    const rate = partialRate(row);
    if (rate === 0) return el('td', { class: 'num dim', text: '–' });
    return el('td', { class: 'num' },
      el('span', { class: 'rate rate-warning' },
        el('span', { class: 'rate-label', text: formatPercent(rate) }),
        el('span', { class: 'badge badge-warning' }, el('span', { 'aria-hidden': 'true', text: partialLevel().icon }), partialLevel().label)));
  }

  function failureRate(row) {
    return row.total ? Number(row.failure_count) / Number(row.total) : 0;
  }

  function failureCell(row) {
    const rate = failureRate(row);
    const level = failureLevel(rate);
    return el('td', { class: 'num' },
      el('span', { class: `rate rate-${level.name}` },
        el('span', { class: 'rate-bar', 'aria-hidden': 'true' }, el('i', { style: `width:${Math.round(rate * 100)}%` })),
        el('span', { class: 'rate-label', text: formatPercent(rate) }),
        el('span', { class: `badge badge-${level.name}` }, el('span', { 'aria-hidden': 'true', text: level.icon }), level.label)));
  }

  function countCell(value) {
    const count = Number(value || 0);
    return el('td', { class: count === 0 ? 'num dim' : 'num', text: count === 0 ? '–' : formatNumber(count) });
  }

  function parseKey(row) {
    return `${row.source}|${row.domain}`;
  }

  function parseDomainLabel(row) {
    return row.domain || '(도메인 없음)';
  }

  function isParseOpen(row) {
    return state.parse.open.has(parseKey(row));
  }

  function parseDetailId(row, view) {
    return `parse-detail-${view}-${[...parseKey(row)].map((char) => char.charCodeAt(0).toString(16)).join('')}`;
  }

  function domainToggle(row, view) {
    if (!row.domain) return el('span', { class: 'domain', text: parseDomainLabel(row) });
    return el('button', {
      class: 'domain-toggle', type: 'button', 'data-parse-key': parseKey(row), 'data-parse-view': view,
      'aria-expanded': String(isParseOpen(row)), 'aria-controls': parseDetailId(row, view),
      onclick: () => toggleParseDetail(row)
    }, el('span', { class: 'caret', 'aria-hidden': 'true', text: '▶' }), el('span', { class: 'domain', text: parseDomainLabel(row) }));
  }

  function parseRow(row) {
    const level = failureLevel(failureRate(row));
    return el('tr', { class: level.name === 'critical' ? 'row-critical' : '' },
      el('td', {}, domainToggle(row, 'table')),
      el('td', { text: SOURCE_LABELS[row.source] || row.source }),
      countCell(row.total),
      countCell(row.total_attempts),
      el('td', { class: 'num', text: formatPercent(hasPartialColumns(row) ? completeRate(row) : successRate(row)) }),
      partialCell(row),
      failureCell(row),
      countCell(row.low_confidence_count),
      MISSING_COLUMNS.map(([key]) => countCell(row[key])));
  }

  function parseDetailRow(row, columnCount) {
    return el('tr', {}, el('td', { class: 'detail-cell', colspan: columnCount }, parseDetail(row, 'table')));
  }

  function parseRowGroup(row, columnCount) {
    return [parseRow(row), isParseOpen(row) && parseDetailRow(row, columnCount)];
  }

  function parseTable(rows) {
    const columnCount = 8 + MISSING_COLUMNS.length;
    const head = el('tr', {},
      el('th', { text: '도메인' }),
      el('th', { text: '출처' }),
      el('th', { class: 'num', text: '건수' }),
      el('th', { class: 'num', text: '시도' }),
      el('th', { class: 'num', text: rows.every(hasPartialColumns) ? '완전 성공' : '성공률' }),
      el('th', { class: 'num', text: '일부 누락' }),
      el('th', { class: 'num', text: '실패율' }),
      el('th', { class: 'num', text: '낮은 신뢰' }),
      MISSING_COLUMNS.map(([, label]) => el('th', { class: 'num', text: `${label} 누락` })));
    return el('div', { class: 'table-wrap parse-table' },
      el('table', {}, el('thead', {}, head), el('tbody', {}, rows.flatMap((row) => parseRowGroup(row, columnCount)))));
  }

  function metric(label, value, level) {
    return el('div', { class: 'metric' }, el('dt', { text: label }), el('dd', { class: value === '–' ? 'dim' : '', style: level && `color:var(--status-${level})`, text: value }));
  }

  function parseCardMetrics(row) {
    const failure = failureRate(row);
    const partial = hasPartialColumns(row) ? partialRate(row) : 0;
    return el('dl', { class: 'metrics' },
      metric('건수', formatNumber(row.total)),
      metric(hasPartialColumns(row) ? '완전 성공' : '성공률', formatPercent(hasPartialColumns(row) ? completeRate(row) : successRate(row))),
      metric('실패율', formatPercent(failure), failure >= 0.1 ? failureLevel(failure).name : null),
      hasPartialColumns(row) && metric('일부 누락', partial === 0 ? '–' : formatPercent(partial), partial > 0 ? 'warning' : null));
  }

  function parseCardChips(row) {
    const chips = [
      [`시도 ${formatNumber(row.total_attempts)}`, Number(row.total_attempts || 0) > 0],
      [`낮은 신뢰 ${formatNumber(row.low_confidence_count)}`, Number(row.low_confidence_count || 0) > 0],
      ...MISSING_COLUMNS.map(([key, label]) => [`${label} 누락 ${formatNumber(row[key])}`, Number(row[key] || 0) > 0])
    ].filter(([, show]) => show);
    if (!chips.length) return null;
    return el('div', { class: 'chips parse-card-chips' }, chips.map(([text]) => el('span', { class: 'chip chip-count', text })));
  }

  function parseCardHead(row) {
    const inner = [
      el('div', { class: 'parse-card-title' },
        row.domain && el('span', { class: 'caret', 'aria-hidden': 'true', text: '▶' }),
        el('b', { text: parseDomainLabel(row) }),
        el('span', { class: 'chip', text: SOURCE_LABELS[row.source] || row.source })),
      parseCardMetrics(row)
    ];
    if (!row.domain) return el('div', { class: 'parse-card-head' }, inner);
    return el('button', {
      class: 'parse-card-head', type: 'button', 'data-parse-key': parseKey(row), 'data-parse-view': 'card',
      'aria-expanded': String(isParseOpen(row)), 'aria-controls': parseDetailId(row, 'card'),
      onclick: () => toggleParseDetail(row)
    }, inner);
  }

  function parseCard(row) {
    const level = failureLevel(failureRate(row));
    return el('article', { class: level.name === 'critical' ? 'parse-card row-critical' : 'parse-card' },
      parseCardHead(row), parseCardChips(row), isParseOpen(row) && parseDetail(row, 'card'));
  }

  function parseCards(rows) {
    return el('div', { class: 'parse-cards' }, rows.map(parseCard));
  }

  function parseTimeLabel(value) {
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date(value)).map((part) => [part.type, part.value]));
    return `${parts.month}/${parts.day} ${parts.hour}:${parts.minute}`;
  }

  function missingFieldLabel(field) {
    const column = MISSING_FIELD_COLUMNS[field];
    const entry = MISSING_COLUMNS.find(([key]) => key === column);
    return entry ? entry[1] : field;
  }

  function logStatusBadge(status) {
    const info = LOG_STATUS[status] || LOG_STATUS.failed;
    return el('span', { class: `badge ${info.badge}` }, el('span', { 'aria-hidden': 'true', text: info.icon }), info.label);
  }

  function logItem(log) {
    const fields = log.missing_fields || [];
    return el('li', { class: 'log-item' },
      el('div', { class: 'log-top' },
        el('span', { class: 'log-time', text: `${parseTimeLabel(log.last_seen_at)} KST` }),
        logStatusBadge(log.status),
        el('span', { class: 'log-meta', text: `시도 ${formatNumber(log.attempt_count)}회 · 신뢰도 ${CONFIDENCE_LABELS[log.confidence] || '-'}` })),
      fields.length > 0 && el('div', { class: 'chips' }, fields.map((field) => el('span', { class: 'chip chip-warn', text: `${missingFieldLabel(field)} 누락` }))));
  }

  function parseDetailBody(entry) {
    if (entry.status === 'loading') return skeletons(3, 'skeleton-line');
    if (entry.status === 'unavailable') return el('div', { class: 'log-notice', role: 'status', text: SERVER_UPDATE_MESSAGE });
    if (entry.status === 'error') return notice(entry.message);
    if (!entry.logs.length) return emptyState('최근 30일 기록이 없어요', '이 도메인의 파싱 기록이 아직 없어요.');
    return el('ul', { class: 'log-list' }, entry.logs.map(logItem));
  }

  function parseDetail(row, view) {
    const entry = state.parse.open.get(parseKey(row));
    return el('div', { class: 'log-detail', id: parseDetailId(row, view) },
      el('div', { class: 'log-detail-title', text: `최근 기록 (최대 ${PARSE_LOG_LIMIT}건, 시각은 KST)` }),
      parseDetailBody(entry));
  }

  function renderParseList() {
    const list = $('parse-list');
    const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.parseKey : null;
    const focusView = focusKey ? document.activeElement.dataset.parseView : null;
    clear(list).append(parseTable(state.parse.rows), parseCards(state.parse.rows));
    if (!focusKey) return;
    const toggle = [...list.querySelectorAll('[data-parse-key]')].find((node) => node.dataset.parseKey === focusKey && node.dataset.parseView === focusView);
    if (toggle) toggle.focus();
  }

  function toggleParseDetail(row) {
    const key = parseKey(row);
    if (state.parse.open.has(key)) {
      state.parse.open.delete(key);
      renderParseList();
      return;
    }
    const entry = { status: 'loading', logs: [], message: '' };
    state.parse.open.set(key, entry);
    renderParseList();
    loadParseLogs(row, entry);
  }

  function applyParseLogsResult(entry, data, error) {
    if (error && isMissingFunction(error)) entry.status = 'unavailable';
    else if (error) Object.assign(entry, { status: 'error', message: describeError(error) });
    else Object.assign(entry, { status: 'ready', logs: data || [] });
  }

  async function loadParseLogs(row, entry) {
    const { data, error } = await db.rpc('admin_parse_logs_by_domain', { p_domain: row.domain, p_source: row.source, p_limit: PARSE_LOG_LIMIT });
    applyParseLogsResult(entry, data, error);
    if (state.parse.open.get(parseKey(row)) === entry) renderParseList();
  }

  async function loadParseQuality() {
    const panel = clear($('panel-parse'));
    state.parse = { rows: [], open: new Map() };
    panel.append(el('div', { class: 'toolbar' }, el('h2', { text: '파싱 품질 (최근 30일)' })), ...skeletons(4, 'skeleton-row'));
    const { data, error } = await db.rpc('admin_parse_quality');
    clear(panel).append(el('div', { class: 'toolbar' }, el('h2', { text: '파싱 품질 (최근 30일)' })));
    if (error) return panel.append(notice(describeError(error)));
    if (!data.length) return panel.append(emptyState('아직 파싱 기록이 없어요', '최근 30일 동안 기록된 청첩장 파싱이 없어요.'));
    state.parse.rows = data;
    panel.append(el('div', { id: 'parse-list' }));
    renderParseList();
  }

  function ratingChips(review) {
    return el('div', { class: 'chips' },
      [['음식', review.food_rating], ['주차', review.parking_rating], ['분위기', review.mood_rating]].map(([label, value]) =>
        el('span', { class: 'chip', text: `${label} ${RATING_LABELS[value] || value}` })));
  }

  function reportReasonLabels(review) {
    return (review.report_reasons || []).map((reason) => REPORT_REASON_LABELS[reason] || reason);
  }

  function reportBadges(review) {
    const openCount = Number(review.open_report_count || 0);
    if (!openCount) return null;
    return el('div', { class: 'chips' },
      el('span', { class: 'badge badge-warning' }, el('span', { 'aria-hidden': 'true', text: '◆' }), `신고 ${formatNumber(openCount)}건`),
      reportReasonLabels(review).map((label) => el('span', { class: 'chip', text: label })));
  }

  function hasOpenReports(review) {
    return Number(review.open_report_count || 0) > 0;
  }

  function cancelButton() {
    return el('button', { class: 'btn btn-small', type: 'button', onclick: () => askConfirm(null), text: '취소' });
  }

  function toggleActions(review) {
    const isHidden = Boolean(review.hidden_at);
    const verb = isHidden ? '복구' : '숨기기';
    if (state.reviews.confirmId !== review.id) {
      return el('div', { class: 'review-actions' },
        el('button', { class: 'btn btn-small', type: 'button', onclick: () => askConfirm(review.id, 'toggle'), text: verb }));
    }
    return el('div', { class: 'review-actions' },
      el('span', { class: 'confirm-text', text: isHidden ? '이 후기를 다시 공개할까요?' : '이 후기를 앱에서 숨길까요?' }),
      el('button', { class: isHidden ? 'btn btn-small btn-primary' : 'btn btn-small btn-danger', type: 'button', onclick: () => toggleReviewHidden(review.id), text: `${verb} 확인` }),
      cancelButton());
  }

  function reportActionIdle(review) {
    return el('div', { class: 'review-actions' },
      el('button', { class: 'btn btn-small btn-danger', type: 'button', onclick: () => askConfirm(review.id, 'hide'), text: '숨기고 신고 처리' }),
      el('button', { class: 'btn btn-small', type: 'button', onclick: () => askConfirm(review.id, 'dismiss'), text: '문제없음' }));
  }

  function reportActionConfirm(review) {
    const hide = state.reviews.confirmAction === 'hide';
    return el('div', { class: 'review-actions' },
      el('span', { class: 'confirm-text', text: hide ? '후기를 숨기고 신고를 처리할까요?' : '문제없음으로 신고를 닫을까요? 후기는 그대로 보여요.' }),
      el('button', { class: hide ? 'btn btn-small btn-danger' : 'btn btn-small btn-primary', type: 'button', onclick: () => resolveReports(review.id, hide), text: hide ? '숨기고 처리 확인' : '문제없음 확인' }),
      cancelButton());
  }

  function reportActions(review) {
    if (state.reviews.confirmId !== review.id) return reportActionIdle(review);
    return reportActionConfirm(review);
  }

  function reviewActions(review) {
    return hasOpenReports(review) ? reportActions(review) : toggleActions(review);
  }

  function reviewSelectBox(review) {
    return el('label', { class: 'review-select' },
      el('input', {
        type: 'checkbox', checked: state.reviews.selected.has(review.id), disabled: isBulkRunning(),
        'aria-label': `${review.venue_name} 후기 선택`, onchange: (event) => selectReview(review.id, event.target.checked)
      }));
  }

  function isBulkRunning() {
    return state.reviews.bulk.total > 0;
  }

  function selectReview(reviewId, checked) {
    if (checked) state.reviews.selected.add(reviewId);
    else state.reviews.selected.delete(reviewId);
    state.reviews.bulk.confirming = false;
    renderReviewList();
  }

  function selectAllOnPage(checked) {
    state.reviews.rows.forEach((review) => {
      if (checked) state.reviews.selected.add(review.id);
      else state.reviews.selected.delete(review.id);
    });
    state.reviews.bulk.confirming = false;
    renderReviewList();
  }

  function selectAllControl() {
    const rows = state.reviews.rows;
    const allSelected = rows.length > 0 && rows.every((review) => state.reviews.selected.has(review.id));
    return el('label', { class: 'select-all' },
      el('input', { type: 'checkbox', checked: allSelected, disabled: isBulkRunning(), onchange: (event) => selectAllOnPage(event.target.checked) }),
      '이 페이지 전체 선택');
  }

  function bulkTargets(action) {
    const wantHidden = action === 'hide';
    return state.reviews.rows.filter((review) => state.reviews.selected.has(review.id) && Boolean(review.hidden_at) !== wantHidden);
  }

  function bulkVerb(action) {
    return action === 'hide' ? '숨기기' : '숨김 해제';
  }

  function askBulk(action) {
    state.reviews.bulk = { action, confirming: true, done: 0, total: 0 };
    renderBulkBar();
  }

  function cancelBulk() {
    state.reviews.bulk = { action: null, confirming: false, done: 0, total: 0 };
    renderBulkBar();
  }

  function clearSelection() {
    state.reviews.selected.clear();
    cancelBulk();
    renderReviewList();
  }

  function bulkIdleRow(count) {
    return el('div', { class: 'bulk-row' },
      el('span', { class: 'bulk-count', text: `${formatNumber(count)}개 선택` }),
      el('button', { class: 'btn btn-small btn-danger', type: 'button', onclick: () => askBulk('hide'), text: '숨기기' }),
      el('button', { class: 'btn btn-small', type: 'button', onclick: () => askBulk('unhide'), text: '숨김 해제' }),
      el('button', { class: 'btn btn-small', type: 'button', onclick: clearSelection, text: '선택 해제' }));
  }

  function bulkConfirmRow() {
    const { action } = state.reviews.bulk;
    const targets = bulkTargets(action);
    if (!targets.length) {
      return el('div', { class: 'bulk-row' },
        el('span', { class: 'confirm-text', text: action === 'hide' ? '이미 모두 숨겨진 후기예요' : '숨겨진 후기가 선택되지 않았어요' }),
        cancelBulkButton());
    }
    return el('div', { class: 'bulk-row' },
      el('span', { class: 'confirm-text', text: `${formatNumber(targets.length)}개 후기를 ${bulkVerb(action)} 할까요?` }),
      el('button', { class: action === 'hide' ? 'btn btn-small btn-danger' : 'btn btn-small btn-primary', type: 'button', onclick: runBulk, text: `${bulkVerb(action)} 확인` }),
      cancelBulkButton());
  }

  function cancelBulkButton() {
    return el('button', { class: 'btn btn-small', type: 'button', onclick: cancelBulk, text: '취소' });
  }

  function bulkProgressRow() {
    const { done, total, action } = state.reviews.bulk;
    return el('div', { class: 'bulk-row', role: 'status' },
      el('span', { class: 'confirm-text', text: `${bulkVerb(action)} 진행 중 ${formatNumber(done)}/${formatNumber(total)}` }),
      el('div', { class: 'progress', style: 'flex:1 1 100%' }, el('i', { style: `width:${Math.round((done / total) * 100)}%` })));
  }

  function bulkBarContent() {
    if (isBulkRunning()) return bulkProgressRow();
    if (state.reviews.bulk.confirming) return bulkConfirmRow();
    return bulkIdleRow(state.reviews.selected.size);
  }

  function renderBulkBar() {
    const bar = $('bulk-bar');
    if (!bar) return;
    bar.hidden = state.reviews.selected.size === 0;
    clear(bar).append(bulkBarContent());
  }

  async function hideOneReview(review, shouldHide) {
    const { data, error } = await db.rpc('admin_set_review_hidden', { p_review_id: review.id, p_hidden: shouldHide });
    if (error) return false;
    setRowHidden(review, data);
    state.reviews.selected.delete(review.id);
    return true;
  }

  function bulkResultMessage(action, total, failed) {
    if (failed === 0) return `${formatNumber(total)}개 후기를 ${bulkVerb(action)} 했어요`;
    return `${formatNumber(total - failed)}개 완료, ${formatNumber(failed)}개 실패했어요`;
  }

  async function runBulk() {
    const { action } = state.reviews.bulk;
    const targets = bulkTargets(action);
    state.reviews.bulk = { action, confirming: false, done: 0, total: targets.length };
    renderReviewList();
    let failed = 0;
    for (const review of targets) {
      const ok = await hideOneReview(review, action === 'hide');
      if (!ok) failed += 1;
      state.reviews.bulk.done += 1;
      renderReviewList();
    }
    state.reviews.bulk = { action: null, confirming: false, done: 0, total: 0 };
    renderReviewList();
    showToast(bulkResultMessage(action, targets.length, failed));
  }

  function reviewCard(review) {
    const error = state.reviews.errors[review.id];
    const classes = ['review', review.hidden_at && 'is-hidden', state.reviews.selected.has(review.id) && 'is-selected'].filter(Boolean).join(' ');
    return el('article', { class: classes },
      el('div', { class: 'review-head' },
        reviewSelectBox(review),
        el('span', { class: 'review-venue', text: review.venue_name }),
        review.hidden_at && el('span', { class: 'badge badge-hidden', text: '숨김' }),
        el('span', { class: 'review-meta', text: `${review.reviewer_label} · ${formatDateTime(review.created_at)}` })),
      ratingChips(review),
      reportBadges(review),
      el('p', { class: review.comment ? 'review-comment' : 'review-comment is-empty', text: review.comment || '(코멘트 없음)' }),
      reviewActions(review),
      error && el('div', { class: 'row-error', role: 'alert', text: error }));

  function pager() {
    const page = Math.floor(state.reviews.offset / REVIEW_PAGE_SIZE) + 1;
    return el('div', { class: 'pager' },
      el('button', { class: 'btn', type: 'button', disabled: state.reviews.offset === 0, onclick: () => goToReviewPage(-1), text: '이전' }),
      el('span', { text: `${page} 페이지` }),
      el('button', { class: 'btn', type: 'button', disabled: !state.reviews.hasNext, onclick: () => goToReviewPage(1), text: '다음' }));
  }

  function emptyReviewTitle() {
    if (state.reviews.reportedOnly) return '처리할 신고가 없어요';
    return state.reviews.hiddenOnly ? '숨긴 후기가 없어요' : '후기가 없어요';
  }

  function renderReviewList() {
    const list = clear($('review-list'));
    renderBulkBar();
    if (!state.reviews.rows.length) {
      list.append(emptyState(emptyReviewTitle(), state.reviews.search ? '검색어를 바꿔 보세요.' : '조건에 맞는 후기가 없어요.'));
      return;
    }
    list.append(selectAllControl(), ...state.reviews.rows.map(reviewCard), pager());
  }

  function askConfirm(reviewId, action) {
    state.reviews.confirmId = reviewId;
    state.reviews.confirmAction = reviewId ? action : null;
    renderReviewList();
  }

  function snapshotReportState(review) {
    return { hidden_at: review.hidden_at, open_report_count: review.open_report_count, report_reasons: review.report_reasons };
  }

  function restoreReportState(review, snapshot) {
    Object.assign(review, snapshot);
  }

  function markReportsResolved(review, hide) {
    review.open_report_count = 0;
    review.report_reasons = [];
    if (hide) review.hidden_at = new Date().toISOString();
  }

  async function resolveReports(reviewId, hide) {
    const review = state.reviews.rows.find((row) => row.id === reviewId);
    if (!review) return;
    const snapshot = snapshotReportState(review);
    askConfirm(null);
    delete state.reviews.errors[reviewId];
    markReportsResolved(review, hide);
    renderReviewList();
    const { data, error } = await db.rpc('admin_resolve_review_reports', { p_review_id: reviewId, p_hide: hide });
    if (error) {
      restoreReportState(review, snapshot);
      state.reviews.errors[reviewId] = describeError(error);
    } else {
      setRowHidden(review, data);
    }
    renderReviewList();
  }

  function setRowHidden(review, hiddenAt) {
    review.hidden_at = hiddenAt;
  }

  async function toggleReviewHidden(reviewId) {
    const review = state.reviews.rows.find((row) => row.id === reviewId);
    if (!review) return;
    const previous = review.hidden_at;
    const shouldHide = !previous;
    askConfirm(null);
    delete state.reviews.errors[reviewId];
    setRowHidden(review, shouldHide ? new Date().toISOString() : null);
    renderReviewList();
    const { data, error } = await db.rpc('admin_set_review_hidden', { p_review_id: reviewId, p_hidden: shouldHide });
    if (error) {
      setRowHidden(review, previous);
      state.reviews.errors[reviewId] = describeError(error);
    } else {
      setRowHidden(review, data);
    }
    renderReviewList();
  }

  function goToReviewPage(direction) {
    state.reviews.offset = Math.max(0, state.reviews.offset + direction * REVIEW_PAGE_SIZE);
    loadReviews();
  }

  function restartReviews() {
    state.reviews.offset = 0;
    loadReviews();
  }

  async function loadReviews() {
    const requestId = ++state.reviews.requestId;
    state.reviews.confirmId = null;
    state.reviews.confirmAction = null;
    state.reviews.errors = {};
    state.reviews.selected.clear();
    state.reviews.bulk = { action: null, confirming: false, done: 0, total: 0 };
    renderBulkBar();
    clear($('review-list')).append(...skeletons(3, 'skeleton-row'));
    const { data, error } = await db.rpc('admin_list_reviews', {
      p_search: state.reviews.search || null,
      p_include_hidden: state.reviews.includeHidden,
      p_limit: REVIEW_PAGE_SIZE + 1,
      p_offset: state.reviews.offset,
      p_reported_only: state.reviews.reportedOnly
    });
    if (requestId !== state.reviews.requestId) return;
    if (error) {
      clear($('review-list')).append(notice(describeError(error)));
      return;
    }
    state.reviews.hasNext = data.length > REVIEW_PAGE_SIZE;
    state.reviews.rows = data.slice(0, REVIEW_PAGE_SIZE).filter((review) => !state.reviews.hiddenOnly || review.hidden_at);
    renderReviewList();
  }

    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  }
